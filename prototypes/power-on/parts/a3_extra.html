<style>
/* ---------- v3: true-story badge (narration) and stamps (props) ---------- */
.tstory { justify-self: start; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; animation: pop .4s both; }
#screen[data-era="1"] .tstory { font-family: var(--f-term); font-size: 1.15rem; background: #3dff72; color: #031006; letter-spacing: .1em; }
#screen[data-era="2"] .tstory { font: 700 1rem var(--f-90s); color: #ff2020; background: #ffff66; border: 2px dashed #ff2020; text-transform: none; letter-spacing: 0; animation: blink 1s steps(1) 3; }
#screen[data-era="3"] .tstory { font: 700 .75rem var(--f-aqua); color: #fff; border-radius: 999px; background: linear-gradient(#ffb15c, #ff7a00 50%, #f06400 51%, #ff9a2e); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
#screen[data-era="4"] .tstory { font: 700 .72rem var(--f-flat); color: #fff; background: #e74c3c; }
#screen[data-era="5"] .tstory { font: italic 400 1rem var(--f-serif); text-transform: none; letter-spacing: 0; color: var(--acc); border: 1px solid rgba(255,154,77,.4); border-radius: 999px; }
.story-stamp { display: inline-block; font: 700 .62rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: #c0262d; border: 2px solid #c0262d; padding: 3px 6px; transform: rotate(-4deg); margin-right: 6px; vertical-align: middle; }
.story-cap { font-size: .78rem; color: var(--muted); }

/* sticker */
.sticker { display: grid; gap: 12px; justify-items: center; width: min(100%, 420px); }
.cubeface { position: relative; width: min(100%, 340px); aspect-ratio: 1; background: linear-gradient(145deg, #2a2a2e, #0f0f11); box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); display: grid; place-items: center; }
.cubeface .under { color: #8a8a93; font: 1.15rem/1.3 var(--f-term); text-align: center; padding: 16px; }
.cubeface .peel { position: absolute; inset: 12% 14%; width: auto; border: 0; cursor: pointer; transform-origin: 8% 6%; transition: transform .8s cubic-bezier(.3,1.3,.5,1), box-shadow .8s; }
.cubeface .peel.off { transform: rotate(-58deg) translate(-12%, -38%) scale(.92); box-shadow: 18px 26px 30px rgba(0,0,0,.6); }
.sticker .story-cap { color: #8ccf9f; }

/* coffee */
.coffee canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; background: #000; }
.coffee .lvl { font-family: var(--f-mono); font-size: .8rem; }

/* ten days */
.tenday .days { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.tenday .days i { font: 700 .8rem/2.2 var(--f-mono); font-style: normal; text-align: center; background: #fff; border: 2px inset #ddd; color: #999; transition: background .2s; }
.tenday .days i.on { background: #000080; color: #fff; }
.tenday .msg { margin: 0; font-weight: 700; }
.tenday .names { display: flex; gap: 6px; flex-wrap: wrap; }
.tenday .names span { flex: 1; min-width: 90px; text-align: center; padding: 6px; background: #fff; border: 2px outset #eee; opacity: .25; transition: opacity .4s; font-weight: 700; }
.tenday .names span.on { opacity: 1; }
.tenday .names small { display: block; font-weight: 400; font-size: .72rem; }
.tenday .names span:last-child.on { background: #ffff66; }

/* browser wars */
.wars-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wars-grid > div { background: #fff; border: 2px inset #ddd; padding: 8px; min-width: 0; overflow: hidden; }
.wars-grid code { font-family: "Courier New", monospace; color: #800000; display: block; margin: 4px 0; }
.wars-grid p { margin: 0; font-weight: 700; }
.blinky { animation: blink 1s steps(1) infinite; }
.marq { overflow: hidden; white-space: nowrap; } .marq span { display: inline-block; padding-left: 100%; animation: marq 6s linear infinite; }

/* gmail */
.gmail .meters { display: grid; gap: 10px; }
.gmail .meters > div { display: grid; grid-template-columns: 110px minmax(0,1fr) 72px; gap: 8px; align-items: center; font-size: .82rem; }
.gmail .meters b { display: block; height: 14px; border-radius: 7px; background: linear-gradient(#ffd38a, #ff8a1a); width: var(--w, 0); min-width: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
.gmail .meters .big b { background: linear-gradient(#a8e06a, #5aa51c); }
.gmail .meters em { font-style: normal; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.gmail .joke { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: .82rem; color: var(--muted); }
.gmail .ans { margin: 0; font-weight: 700; color: #3a7d0c; min-height: 1.3em; }

/* jsx */
.jsx .bubbles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 2em; }
.jsx .bubbles span { background: #e74c3c; color: #fff; padding: 5px 10px; border-radius: 14px 14px 14px 2px; font-size: .82rem; animation: pop .35s both; }
.jsx .bubbles span.pos { background: #1abc9c; }

/* outage */
.outage .out { font-family: var(--f-mono); font-size: .76rem; line-height: 1.6; padding: 10px 14px; white-space: pre-wrap; min-height: 6.2em; color: #a1a1aa; }
.outage .out mark { background: #ff4d4d; color: #fff; padding: 0 3px; border-radius: 3px; }
.outage .out .ok { color: #7dd3c0; }
.outage .sites { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 0 14px 14px; }
.outage .sites span { font: .68rem var(--f-mono); text-align: center; padding: 10px 2px; border-radius: 8px; background: rgba(125,211,192,.15); color: #7dd3c0; border: 1px solid rgba(125,211,192,.3); transition: transform .35s, background .35s, color .35s; }
.outage .sites span.dead { background: rgba(255,77,77,.12); color: #ff6b6b; border-color: rgba(255,77,77,.35); transform: rotate(8deg) translateY(4px); }
.outage .sites span.lie { outline: 2px dashed #7dd3c0; outline-offset: 2px; }

/* flat + responsive */
.flatdemo .fd-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
.fd-gloss { font: 700 .95rem var(--f-aqua); color: #fff; padding: 9px 20px; border-radius: 999px; border: 1px solid #1d5fa3; background: linear-gradient(#8fc5f2, #3d8fd6 50%, #2a7cc8 51%, #4f9fe0); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 6px rgba(0,0,0,.25); cursor: default; }
.fd-flat { font: 600 .9rem var(--f-flat); color: #fff; padding: 10px 20px; border: 0; border-radius: 2px; background: #1abc9c; text-transform: uppercase; letter-spacing: .06em; cursor: default; }
.fd-devices { display: flex; align-items: end; justify-content: center; gap: 14px; }
.fd-devices .d { border: 3px solid #2c3e50; border-radius: 6px; padding: 5px; display: grid; gap: 4px; background: #fff; }
.fd-devices .d i { background: #3498db; min-height: 14px; } .fd-devices .d i:nth-child(2) { background: #e67e22; } .fd-devices .d i:nth-child(3) { background: #9b59b6; }
.fd-devices .d1 { width: 46px; height: 84px; grid-template-rows: repeat(3, 1fr); }
.fd-devices .d2 { width: 92px; height: 70px; grid-template-columns: 1fr 1fr; } .fd-devices .d2 i:first-child { grid-column: 1 / -1; }
.fd-devices .d3 { width: 150px; height: 92px; grid-template-columns: repeat(3, 1fr); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: .8rem; }
.flow span { padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); }
.flow i { font-style: normal; color: var(--acc); }
.tree { font-family: var(--f-mono); font-size: .8rem; white-space: pre; overflow-x: auto; gap: 2px; }

/* v3 fixes */
#screen[data-era="3"] .stage .prop > .dio { -webkit-box-reflect: unset; }
@media (max-width: 760px) {
  .starburst { display: none; }
  #hudName { display: none; }
  .wars-grid { grid-template-columns: 1fr; }
  .outage .sites { grid-template-columns: repeat(4, 1fr); }
  .gmail .meters > div { grid-template-columns: 80px minmax(0,1fr) 64px; }
}
</style>
<style>
#audioctl { right: 16px; gap: 4px; padding: 4px 8px; }
#audioctl button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 6px; border-radius: 999px; font: inherit; color: inherit; letter-spacing: inherit; }
#audioctl button:hover { background: rgba(255,255,255,.08); }
#music.off { opacity: .45; }
#mvol { width: 72px; accent-color: var(--lamp); }
#mvol:disabled { opacity: .35; }
@media (max-width: 760px) { #soundLbl, #musicLbl { display: none; } #mvol { width: 44px; } #audioctl { gap: 0; padding: 3px 6px; } }
</style>
