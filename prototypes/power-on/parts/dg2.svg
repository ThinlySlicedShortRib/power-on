<svg class="dg" viewBox="0 0 680 260" role="img" aria-label="Diagram: a home PC dials through a modem and phone line to an ISP modem pool, across the internet backbone, to one beige tower in an office closet running Apache, Perl or PHP, and MySQL." data-dur="3600">
          <path class="route" d="M110 140 H196 q6.5 -10 13 0 t13 0 t13 0 t13 0 t13 0 t13 0 t13 0 t13 0 H516"/>
          <!-- PC -->
          <rect class="bx" x="20" y="100" width="62" height="48" rx="6"/>
          <rect class="ln" x="27" y="107" width="48" height="33" rx="2"/>
          <rect class="bx" x="88" y="96" width="22" height="62" rx="2"/>
          <rect class="bx" x="20" y="156" width="62" height="8" rx="2"/>
          <text class="t" x="62" y="190" text-anchor="middle">your PC</text>
          <text class="ts" x="62" y="205" text-anchor="middle">Windows 95</text>
          <!-- modem -->
          <rect class="bx" x="140" y="128" width="56" height="22" rx="4"/>
          <circle class="led" cx="152" cy="139" r="2.5"/><circle class="led" cx="161" cy="139" r="2.5"/><circle class="led" cx="170" cy="139" r="2.5"/>
          <text class="t" x="168" y="190" text-anchor="middle">modem</text>
          <text class="ts" x="168" y="205" text-anchor="middle">28.8k → 56k</text>
          <!-- phone line -->
          <path class="ln" d="M196 140 q6.5 -10 13 0 t13 0 t13 0 t13 0 t13 0 t13 0 t13 0 t13 0"/>
          <text class="ts" x="248" y="112" text-anchor="middle">phone line</text>
          <text class="ts" x="248" y="125" text-anchor="middle">(dial tone, screech)</text>
          <text class="tl" x="248" y="168" text-anchor="middle">~150 ms</text>
          <!-- ISP -->
          <rect class="bx" x="304" y="100" width="60" height="10" rx="2"/>
          <rect class="bx" x="304" y="114" width="60" height="10" rx="2"/>
          <rect class="bx" x="304" y="128" width="60" height="10" rx="2"/>
          <rect class="bx" x="304" y="142" width="60" height="10" rx="2"/>
          <rect class="bx" x="304" y="156" width="60" height="10" rx="2"/>
          <text class="t" x="334" y="190" text-anchor="middle">ISP</text>
          <text class="ts" x="334" y="205" text-anchor="middle">dial-up pool</text>
          <!-- backbone -->
          <path class="ln thick" d="M364 140 H516"/>
          <text class="ts" x="440" y="128" text-anchor="middle">internet backbone</text>
          <text class="tl" x="440" y="160" text-anchor="middle">~80 ms</text>
          <!-- closet -->
          <rect class="zone" x="500" y="54" width="164" height="166" rx="4"/>
          <text class="t" x="582" y="76" text-anchor="middle">office closet</text>
          <rect class="bx" x="516" y="92" width="40" height="100" rx="3"/>
          <path class="ln" d="M522 104 h28 M522 114 h28"/>
          <circle class="led" cx="536" cy="178" r="2.5"/>
          <text class="ts" x="566" y="110">Apache</text>
          <text class="ts" x="566" y="128">Perl / PHP</text>
          <text class="ts" x="566" y="146">MySQL</text>
          <text class="ts" x="566" y="176">one machine</text>
          <text class="tl" x="340" y="244" text-anchor="middle">a 100 KB page at 28.8 kbit/s ≈ 30 s</text>
          <circle class="packet" r="6" cx="110" cy="140"/>
        </svg>