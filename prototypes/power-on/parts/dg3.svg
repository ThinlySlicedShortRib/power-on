<svg class="dg" viewBox="0 0 600 330" role="img" aria-label="Diagram: a laptop on DSL reaches a colocation data center where a load balancer spreads requests over three LAMP servers backed by memcached and MySQL. From 2006 the same setup could be rented as EC2 virtual servers and S3 storage." data-dur="2400">
          <defs><marker id="d3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
          <path class="route" d="M104 150 C130 150 140 92 170 92 H376 L430 73"/>
          <!-- laptop -->
          <rect class="bx" x="30" y="128" width="64" height="42" rx="4"/>
          <path class="bx" d="M22 174 h80 l-6 8 h-68 z"/>
          <text class="t" x="62" y="206" text-anchor="middle">laptop</text>
          <text class="ts" x="62" y="221" text-anchor="middle">DSL · ~3 Mbit/s</text>
          <text class="tl" x="112" y="112">~40 ms</text>
          <path class="ln" d="M104 150 C130 150 140 92 170 92"/>
          <path class="ln dash" d="M104 162 C140 162 160 258 200 258"/>
          <!-- colo -->
          <rect class="zone" x="150" y="20" width="430" height="132" rx="10"/>
          <text class="t" x="166" y="42">2004 · colo: you own the boxes</text>
          <rect class="bx" x="170" y="72" width="70" height="40" rx="4"/>
          <text class="t" x="205" y="96" text-anchor="middle">LB</text>
          <text class="ts" x="205" y="132" text-anchor="middle">load balancer</text>
          <path class="ln" d="M240 92 H290 M262 92 L290 69 M262 92 L290 115"/>
          <text class="tl" x="248" y="84">&lt;1 ms</text>
          <rect class="bx" x="290" y="62" width="86" height="14" rx="2"/>
          <rect class="bx" x="290" y="85" width="86" height="14" rx="2"/>
          <rect class="bx" x="290" y="108" width="86" height="14" rx="2"/>
          <circle class="led" cx="368" cy="69" r="2.2"/><circle class="led" cx="368" cy="92" r="2.2"/><circle class="led" cx="368" cy="115" r="2.2"/>
          <text class="ts" x="333" y="140" text-anchor="middle">LAMP ×3</text>
          <rect class="bx" x="430" y="58" width="120" height="28" rx="4"/>
          <text class="t" x="490" y="77" text-anchor="middle">memcached</text>
          <path class="ln" d="M376 73 H430 M376 104 L450 110"/>
          <text class="tl" x="380" y="62">~0.2 ms</text>
          <path class="bx" d="M450 98 v28 a40 7 0 0 0 80 0 v-28"/>
          <ellipse class="bx" cx="490" cy="98" rx="40" ry="7"/>
          <text class="t" x="490" y="122" text-anchor="middle">MySQL</text>
          <!-- shift -->
          <path class="ln dash" d="M365 152 V186" marker-end="url(#d3a)"/>
          <text class="tl" x="376" y="174">2006: stop buying hardware</text>
          <!-- cloud -->
          <rect class="zone" x="150" y="190" width="430" height="124" rx="40"/>
          <text class="t" x="176" y="216">2006 → · AWS: rent by the hour</text>
          <rect class="bx" x="200" y="240" width="56" height="36" rx="4"/><text class="t" x="228" y="263" text-anchor="middle">EC2</text>
          <rect class="bx" x="270" y="240" width="56" height="36" rx="4"/><text class="t" x="298" y="263" text-anchor="middle">EC2</text>
          <rect class="bx" x="340" y="240" width="56" height="36" rx="4"/><text class="t" x="368" y="263" text-anchor="middle">EC2</text>
          <path class="bx" d="M440 244 h80 l-8 40 h-64 z"/>
          <ellipse class="bx" cx="480" cy="244" rx="40" ry="6"/>
          <text class="t" x="480" y="270" text-anchor="middle">S3</text>
          <text class="ts" x="365" y="300" text-anchor="middle">virtual servers, created with an API call</text>
          <circle class="packet" r="6" cx="104" cy="150"/>
        </svg>