<svg class="dg" viewBox="0 0 620 300" role="img" aria-label="Diagram: a phone first downloads a JavaScript bundle from a CDN, then the app running in the phone's browser calls a JSON API on platform-as-a-service dynos, which reads from a managed Postgres database. The client devices are highlighted because the app now runs there." data-dur="4200" data-mode="oneway">
          <path class="route" d="M82 62 H250 H82 V96 C150 96 180 206 250 206 H470 H250 C180 206 150 96 82 96"/>
          <!-- clients -->
          <rect class="bx acc" x="42" y="36" width="40" height="72" rx="7"/>
          <path class="ln" d="M56 100 h12"/>
          <text class="t" x="62" y="128" text-anchor="middle">phone</text>
          <rect class="bx acc" x="30" y="170" width="64" height="42" rx="4"/>
          <path class="bx" d="M22 216 h80 l-6 8 h-68 z"/>
          <text class="t" x="62" y="244" text-anchor="middle">laptop</text>
          <text class="tl" x="62" y="268" text-anchor="middle">the app runs here</text>
          <text class="ts" x="62" y="283" text-anchor="middle">React · bundle.js</text>
          <!-- CDN -->
          <path class="ln" d="M82 62 H250"/>
          <text class="tl" x="166" y="54" text-anchor="middle">1 · ~30 ms</text>
          <rect class="bx" x="250" y="36" width="130" height="52" rx="6"/>
          <text class="t" x="315" y="58" text-anchor="middle">CDN</text>
          <text class="ts" x="315" y="76" text-anchor="middle">bundle.js · ~1 MB</text>
          <!-- API -->
          <path class="ln" d="M82 96 C150 96 180 206 250 206"/>
          <path class="ln dash" d="M94 192 C150 192 200 214 250 214"/>
          <text class="tl" x="196" y="140">2 · ~120 ms</text>
          <rect class="bx" x="250" y="176" width="130" height="60" rx="6"/>
          <text class="t" x="315" y="198" text-anchor="middle">JSON API</text>
          <rect class="bx" x="262" y="210" width="22" height="14" rx="2"/><rect class="bx" x="290" y="210" width="22" height="14" rx="2"/><rect class="bx" x="318" y="210" width="22" height="14" rx="2"/><rect class="bx" x="346" y="210" width="22" height="14" rx="2"/>
          <text class="ts" x="315" y="256" text-anchor="middle">PaaS dynos ×4</text>
          <!-- DB -->
          <path class="ln" d="M380 206 H470"/>
          <text class="tl" x="425" y="198" text-anchor="middle">~5 ms</text>
          <path class="bx" d="M470 186 v42 a40 7 0 0 0 80 0 v-42"/>
          <ellipse class="bx" cx="510" cy="186" rx="40" ry="7"/>
          <text class="t" x="510" y="214" text-anchor="middle">Postgres</text>
          <text class="ts" x="510" y="256" text-anchor="middle">managed DB</text>
          <circle class="packet" r="6" cx="82" cy="62"/>
        </svg>