<title>Power On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Comic+Neue:wght@400;700&family=Open+Sans:wght@300;400;600;700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Caveat:wght@600&family=Press+Start+2P&display=swap">
<style>
/* Layout: a fixed WebGL desk scene behind a fixed "screen" layer; a tall invisible scroll track drives
   story beats (one narration line per step) and camera moves between eras. Single dark-room look by design;
   each era repaints the screen layer with its own costume tokens. */
:root {
  color-scheme: dark;
  --room: #0d0b09;
  --room-ink: #f1e6d0;
  --lamp: #ffc874;
  --hud-bg: rgba(16,13,10,.72);
  --hud-line: rgba(241,230,208,.18);
  --f-mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-term: "VT323", "Courier New", monospace;
  --f-90s: "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
  --f-aqua: "Lucida Grande", "Lucida Sans Unicode", Verdana, Tahoma, sans-serif;
  --f-flat: "Open Sans", "Helvetica Neue", Arial, sans-serif;
  --f-now: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Instrument Serif", Georgia, serif;
  --f-hand: "Caveat", "Marker Felt", cursive;
  --f-pixel: "Press Start 2P", "Courier New", monospace;

  /* era tokens (defaults = era 1) */
  --bg: #040a05; --fg: #3dff72; --muted: #1f9a45; --acc: #b6ffca; --acc2: #ffd23d;
  --font-n: var(--f-term); --font-ui: var(--f-term); --n-size: clamp(1.9rem, 3.6vw, 3.3rem);
  --card-bg: rgba(61,255,114,.05); --card-fg: #3dff72; --card-bd: 1px solid #3dff72; --radius: 0px;
  --shadow: 0 0 24px rgba(61,255,114,.18); --bar-bg: #3dff72; --bar-fg: #031006;
  --btn-bg: transparent; --btn-fg: #3dff72; --btn-bd: 1px solid #3dff72;
  --dg-bg: #020602; --dg-fg: #3dff72; --dg-box: #031006; --dg-muted: #1f9a45; --dg-acc: #b6ffca; --dg-acc2: #ffd23d;
  --dg-sw: 1.6; --dg-font: var(--f-term); --dg-filter: drop-shadow(0 0 3px rgba(61,255,114,.55)); --line: #1f9a45;
}
html, body { background: var(--room); color: var(--room-ink); }
body { font-family: var(--f-now); overscroll-behavior: none; }
body.locked { overflow: hidden; height: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

/* ---------- stage layers ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: pan-y; }
#track { position: relative; z-index: -1; width: 1px; pointer-events: none; }
#screen { position: fixed; inset: 0; z-index: 2; opacity: 0; visibility: hidden; background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); overflow: hidden; transition: background-color .5s; }
#screen.live { visibility: visible; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#fx > * { position: absolute; }

.frame { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  align-items: center; gap: clamp(20px, 4vw, 64px); padding: clamp(64px, 9vh, 110px) clamp(16px, 5vw, 80px) clamp(72px, 10vh, 110px); }
.narr { min-width: 0; align-self: center; display: grid; gap: 18px; }
.eratitle { font-family: var(--font-n); color: var(--acc2); letter-spacing: .04em; transition: font-size .5s, opacity .4s; font-size: 1rem; text-transform: uppercase; }
.eratitle b { display: block; font-size: 2.2em; line-height: 1.02; letter-spacing: 0; text-transform: none; color: var(--fg); margin-top: .2em; text-wrap: balance; }
.narr.title .eratitle { font-size: clamp(1rem, 1.6vw, 1.35rem); }
.narr.title .eratitle b { font-size: clamp(2.6rem, 6.5vw, 5.6rem); }
.narr:not(.title) .eratitle b { font-size: 1.15em; display: inline; margin-left: .5em; color: var(--muted); }
.lines { display: grid; gap: 14px; }
.line { font-family: var(--font-n); font-size: var(--n-size); line-height: 1.12; text-wrap: balance; color: var(--fg); transition: opacity .45s, font-size .45s, transform .45s; }
.line.old { opacity: .38; font-size: calc(var(--n-size) * .52); }
.line.old2 { opacity: .18; font-size: calc(var(--n-size) * .44); }
.line .cur { display: inline-block; width: .5em; height: .9em; margin-left: .08em; vertical-align: -.08em; background: var(--fg); animation: blink 1s steps(1) infinite; }
.line em { font-style: normal; color: var(--acc2); }
@keyframes blink { 50% { opacity: 0; } }

.stage { position: relative; min-width: 0; height: min(68vh, 620px); display: grid; place-items: center; }
.prop { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1); }
.prop.out { opacity: 0; transform: translateY(24px) scale(.96); pointer-events: none; }
.prop > * { max-width: 100%; max-height: 100%; }

/* ---------- shared prop pieces (skinned by era tokens) ---------- */
.card { background: var(--card-bg); color: var(--card-fg); border: var(--card-bd); border-radius: var(--radius); box-shadow: var(--shadow);
  width: min(100%, 520px); overflow: hidden; }
.card .bar { background: var(--bar-bg); color: var(--bar-fg); padding: 6px 12px; font-size: .9rem; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.card .body { padding: 16px 18px; display: grid; gap: 10px; }
.card pre { margin: 0; font-family: var(--f-mono); font-size: clamp(.72rem, 1.1vw, .86rem); line-height: 1.55; overflow: auto; white-space: pre; max-height: 46vh; }
.btn { background: var(--btn-bg); color: var(--btn-fg); border: var(--btn-bd); border-radius: var(--radius); padding: 8px 16px; font-family: var(--font-ui); font-size: 1rem; }
.btn:active { transform: translateY(1px); }
.person { width: min(100%, 440px); }
.person .body { grid-template-columns: 112px minmax(0,1fr); gap: 16px; align-items: start; }
.person .face { width: 112px; height: 136px; border: var(--card-bd); border-radius: var(--radius); background: var(--dg-bg); display: grid; place-items: center; position: relative; overflow: hidden; }
.person .face svg { width: 100%; height: 100%; }
.person .face span { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; color: var(--muted); }
.person h3 { margin: 0; font-family: var(--font-n); font-size: 1.6rem; line-height: 1.05; color: var(--card-fg); }
.person .role { font-size: .85rem; color: var(--muted); margin-top: 4px; }
.person ul { margin: 0; padding-left: 1.1em; font-size: .92rem; line-height: 1.45; display: grid; gap: 4px; }
.person .intro { font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; color: var(--acc2); }
.dgwrap { width: 100%; background: var(--dg-bg); border: var(--card-bd); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; overflow-x: auto; position: relative; }
.dg { display: block; width: 100%; min-width: 460px; height: auto; color: var(--dg-fg); filter: var(--dg-filter); }
.dg .ln { fill: none; stroke: currentColor; stroke-width: var(--dg-sw); stroke-linecap: round; stroke-linejoin: round; }
.dg .thick { stroke-width: calc(var(--dg-sw) * 2); }
.dg .dash { stroke-dasharray: 5 5; }
.dg .bx { fill: var(--dg-box); stroke: currentColor; stroke-width: var(--dg-sw); }
.dg .solid { fill: currentColor; }
.dg .zone { fill: none; stroke: var(--dg-muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
.dg .grid { stroke: var(--dg-muted); opacity: .25; stroke-width: 1; fill: none; }
.dg .acc { stroke: var(--dg-acc); stroke-width: calc(var(--dg-sw) + 1); }
.dg .accfill { fill: var(--dg-acc); }
.dg .note { fill: #f2c94c; }
.dg .led { fill: #2fbf71; }
.dg text { font-family: var(--dg-font); }
.dg .t { fill: currentColor; font-size: 12.5px; font-weight: 600; }
.dg .ts { fill: var(--dg-muted); font-size: 11px; }
.dg .tl { fill: var(--dg-acc2); font-size: 11px; font-weight: 700; }
.dg .route { fill: none; stroke: var(--dg-acc); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .75; }
.dg .packet { fill: var(--dg-acc); opacity: 0; transition: fill .2s; }
.dg .packet.on { opacity: 1; }
.dg .packet.back { fill: var(--dg-acc2); }
.dgcap { font-size: .8rem; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 5; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px;
  font-family: var(--f-mono); font-size: .74rem; letter-spacing: .08em; color: var(--room-ink); background: var(--hud-bg);
  border: 1px solid var(--hud-line); border-radius: 999px; padding: 6px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#hudEra { left: 16px; opacity: 0; transition: opacity .6s; }
#hudEra.on { opacity: 1; }
#hudEra .yr { font-size: .95rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--lamp); }
#hudEra .pips { display: flex; gap: 4px; }
#hudEra .pips i { width: 14px; height: 3px; border-radius: 2px; background: var(--hud-line); }
#hudEra .pips i.on { background: var(--lamp); }
#sound { right: 16px; }
#sound[aria-pressed="false"] .w { opacity: .25; }
#hint { position: fixed; z-index: 5; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-family: var(--f-mono);
  font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fg); opacity: 0; transition: opacity .6s; pointer-events: none; }
#hint.on { opacity: .8; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-50%, 6px); } }

/* ---------- intro ---------- */
#intro { position: fixed; inset: 0; z-index: 4; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(20px, 5vh, 48px) clamp(16px, 5vw, 64px); pointer-events: none; transition: opacity .9s; }
#intro.gone { opacity: 0; }
#intro .top { display: flex; justify-content: space-between; gap: 16px; font-family: var(--f-mono); font-size: .76rem; letter-spacing: .16em; text-transform: uppercase; color: rgba(241,230,208,.6); }
#intro h1 { margin: 0; align-self: end; font-family: var(--f-serif); font-weight: 400; font-size: clamp(2.6rem, 8vw, 6.4rem); line-height: .92; letter-spacing: -.01em; color: var(--room-ink); text-wrap: balance; max-width: 12ch; }
#intro h1 i { color: var(--lamp); }
#intro .bottom { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; margin-top: 18px; }
#intro p { margin: 0; max-width: 40ch; font-size: 1rem; line-height: 1.5; color: rgba(241,230,208,.75); }
#power { pointer-events: auto; display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px 14px 16px; border-radius: 999px; border: 1px solid rgba(255,200,116,.5);
  background: rgba(255,200,116,.08); color: var(--lamp); font-family: var(--f-mono); font-size: .9rem; letter-spacing: .18em; text-transform: uppercase; }
#power svg { width: 26px; height: 26px; }
#power:hover { background: rgba(255,200,116,.16); }
#power.pulse svg { animation: pwr 1.8s ease-in-out infinite; }
@keyframes pwr { 50% { filter: drop-shadow(0 0 8px var(--lamp)); } }

/* ---------- transitions (desk view) ---------- */
#trans { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; opacity: 0; text-align: center; padding-inline: 16px; }
#trans .yrs { font-family: var(--f-serif); font-size: clamp(3rem, 11vw, 9rem); line-height: .9; color: var(--room-ink); text-shadow: 0 4px 40px rgba(0,0,0,.8); font-variant-numeric: tabular-nums; }
#trans .yrs span { color: var(--lamp); font-style: italic; }
#trans .cap { font-family: var(--f-mono); font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(241,230,208,.8); margin-top: 14px; text-shadow: 0 2px 12px #000; }
#trans .box { transform: translateY(-14vh); }

#fin { position: fixed; inset: 0; z-index: 3; display: grid; place-items: end center; padding-bottom: clamp(80px, 16vh, 160px); pointer-events: none; opacity: 0; text-align: center; padding-inline: 16px; }
#fin.on { pointer-events: auto; }
#fin h2 { font-family: var(--f-serif); font-weight: 400; font-size: clamp(2.2rem, 6vw, 4.6rem); margin: 0 0 10px; line-height: 1; text-shadow: 0 4px 30px #000; text-wrap: balance; }
#fin h2 i { color: var(--lamp); }
#fin p { margin: 0 auto 20px; max-width: 46ch; color: rgba(241,230,208,.8); text-shadow: 0 2px 12px #000; }

#nogl { position: fixed; inset: 0; z-index: 0; display: none; place-items: center; background: radial-gradient(ellipse at 40% 30%, #2a2118, var(--room) 70%); }
#nogl.on { display: grid; }
#nogl .crt { width: min(70vw, 420px); aspect-ratio: 4/3.3; background: #1b1b1d; border-radius: 18px; padding: 26px; box-shadow: 0 30px 80px #000; max-width: 100%; }
#nogl .crt div { width: 100%; height: 100%; border-radius: 12px / 16px; background: #050806; box-shadow: inset 0 0 40px #000; }

/* ================= ERA COSTUMES ================= */
/* 1 · 1989 green phosphor + NeXT grey windows */
#screen[data-era="1"] { --bg: #040a05; }
#screen[data-era="1"]::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(rgba(0,0,0,.32) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65)); }
#screen[data-era="1"] .line { text-shadow: 0 0 10px rgba(61,255,114,.55); }
#screen[data-era="1"] .next { --card-bg: #a8a8a8; --card-fg: #000; --card-bd: 1px solid #000; --bar-bg: #000; --bar-fg: #fff; --shadow: 4px 4px 0 #000; --muted: #333; }
#screen[data-era="1"] .next .bar { justify-content: center; font-family: var(--f-now); font-size: .8rem; font-weight: 600; }
#screen[data-era="1"] .next .body { background: #fff; margin: 4px; border: 1px solid #555; font-family: "Times New Roman", Times, serif; }

/* 2 · 1995 homepage */
#screen[data-era="2"] {
  --bg: #000030; --fg: #ffff66; --muted: #9ad6ff; --acc: #ff4df0; --acc2: #39ffd9;
  --font-n: var(--f-90s); --font-ui: var(--f-90s); --n-size: clamp(1.7rem, 3.2vw, 2.9rem);
  --card-bg: #c0c0c0; --card-fg: #000; --card-bd: 3px outset #e8e8e8; --radius: 0; --shadow: none;
  --bar-bg: linear-gradient(90deg, #000080, #1084d0); --bar-fg: #fff;
  --btn-bg: #c0c0c0; --btn-fg: #000; --btn-bd: 3px outset #eee;
  --dg-bg: #c0c0c0; --dg-fg: #000; --dg-box: #fff; --dg-muted: #444; --dg-acc: #e000c8; --dg-acc2: #0000c0; --dg-sw: 2; --dg-font: "Courier New", monospace; --dg-filter: none;
  background-color: #000030;
  background-image: radial-gradient(1.4px 1.4px at 12px 18px, #fff 50%, transparent 51%), radial-gradient(1px 1px at 70px 60px, #fff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 40px 110px, #ffef9a 50%, transparent 51%), radial-gradient(1px 1px at 110px 30px, #9ad6ff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 96px 96px, #fff 50%, transparent 51%);
  background-size: 130px 130px;
}
#screen[data-era="2"] .card .body { font-family: "Times New Roman", Times, serif; }
#screen[data-era="2"] .person .body, #screen[data-era="2"] .card .bar { font-family: var(--f-90s); font-weight: 700; }
#screen[data-era="2"] .eratitle b { background: linear-gradient(90deg,#ff3b3b,#ffb000,#fff200,#3bff6e,#39d0ff,#b45cff,#ff3b3b); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: rainbow 4s linear infinite; }
#screen[data-era="2"] .narr:not(.title) .eratitle b { color: transparent; }
@keyframes rainbow { to { background-position: -200% 0; } }
#screen[data-era="2"] .person h3 { color: #000080; }
#screen[data-era="2"] .person .face { border: 2px inset #eee; background: #fff; }
#screen[data-era="2"] .dgwrap { border: 3px inset #e0e0e0; }
#screen[data-era="2"] .dg { shape-rendering: crispEdges; }
.marquee { top: 0; left: 0; right: 0; height: 30px; background: #000; border-bottom: 2px ridge #888; overflow: hidden; font-family: var(--f-90s); font-weight: 700; color: #39ffd9; line-height: 30px; white-space: nowrap; }
.marquee span { display: inline-block; padding-left: 100%; animation: marq 22s linear infinite; }
@keyframes marq { to { transform: translateX(-100%); } }
.uc { bottom: 0; left: 0; right: 0; height: 16px; background: repeating-linear-gradient(-45deg, #ffd400 0 14px, #111 14px 28px); background-size: 40px 16px; animation: uc 1.2s linear infinite; }
@keyframes uc { to { background-position: 40px 0; } }
.newbadge { font-family: var(--f-pixel); font-size: .6rem; color: #ff2020; animation: blink .8s steps(1) infinite; }

/* 3 · 2004 Web 2.0 gloss */
#screen[data-era="3"] {
  --bg: #e9f3fb; --fg: #17324d; --muted: #5a7591; --acc: #ff6a00; --acc2: #ff6a00;
  --font-n: var(--f-aqua); --font-ui: var(--f-aqua); --n-size: clamp(1.6rem, 2.9vw, 2.6rem);
  --card-bg: #fff; --card-fg: #17324d; --card-bd: 1px solid #a9c4dd; --radius: 14px; --shadow: 0 10px 30px rgba(23,50,77,.22), inset 0 1px 0 #fff;
  --bar-bg: linear-gradient(#8fc5f2, #3d8fd6 50%, #2a7cc8 51%, #4f9fe0); --bar-fg: #fff;
  --btn-bg: linear-gradient(#ffb15c, #ff7a00 50%, #f06400 51%, #ff9a2e); --btn-fg: #fff; --btn-bd: 1px solid #c75200;
  --dg-bg: #fff; --dg-fg: #17324d; --dg-box: #eaf4fd; --dg-muted: #7d95ad; --dg-acc: #ff6a00; --dg-acc2: #2a7cc8; --dg-sw: 1.6; --dg-font: var(--f-aqua); --dg-filter: none;
  background: repeating-linear-gradient(135deg, #eef6fc 0 14px, #e2eef9 14px 28px);
}
#screen[data-era="3"] .line { text-shadow: 0 1px 0 #fff; letter-spacing: -.01em; }
#screen[data-era="3"] .eratitle b { color: #17324d; text-shadow: 0 1px 0 #fff; }
#screen[data-era="3"] .card .bar { text-shadow: 0 -1px 0 rgba(0,0,0,.3); font-weight: 700; }
#screen[data-era="3"] .btn { border-radius: 999px; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.2); font-weight: 700; text-shadow: 0 -1px 0 rgba(0,0,0,.25); }
#screen[data-era="3"] .stage .prop > * { -webkit-box-reflect: below 2px linear-gradient(transparent 82%, rgba(255,255,255,.22)); }
.gloss-top { top: 0; left: 0; right: 0; height: 54px; background: linear-gradient(#6fb3ec, #2a7cc8 50%, #1d6db8 51%, #3a8ad6); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.gloss-top b { position: absolute; left: clamp(16px, 5vw, 80px); top: 10px; font: 700 1.5rem/1 var(--f-aqua); color: #fff; letter-spacing: -.04em; text-shadow: 0 -1px 0 rgba(0,0,0,.3); }
.gloss-top b::after { content: "beta"; font-size: .55rem; vertical-align: super; margin-left: 4px; color: #ffe0b8; letter-spacing: .05em; }
.starburst { right: clamp(16px, 5vw, 80px); top: 66px; width: 84px; height: 84px; display: grid; place-items: center; transform: rotate(-12deg);
  background: #ff6a00; clip-path: polygon(50% 0, 61% 14%, 79% 8%, 80% 27%, 98% 32%, 88% 49%, 98% 66%, 80% 71%, 79% 90%, 61% 85%, 50% 100%, 39% 85%, 21% 90%, 20% 71%, 2% 66%, 12% 49%, 2% 32%, 20% 27%, 21% 8%, 39% 14%);
  font: 700 .95rem/1 var(--f-aqua); color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.3); animation: spinslow 18s linear infinite; }
@keyframes spinslow { to { transform: rotate(348deg); } }

/* 4 · 2010 flat */
#screen[data-era="4"] {
  --bg: #ecf0f1; --fg: #2c3e50; --muted: #7f8c8d; --acc: #1abc9c; --acc2: #e67e22;
  --font-n: var(--f-flat); --font-ui: var(--f-flat); --n-size: clamp(1.7rem, 3.1vw, 2.8rem);
  --card-bg: #fff; --card-fg: #2c3e50; --card-bd: 0 solid transparent; --radius: 2px; --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
  --bar-bg: #2c3e50; --bar-fg: #ecf0f1;
  --btn-bg: transparent; --btn-fg: #1abc9c; --btn-bd: 2px solid #1abc9c;
  --dg-bg: #fff; --dg-fg: #2c3e50; --dg-box: #ecf0f1; --dg-muted: #95a5a6; --dg-acc: #e74c3c; --dg-acc2: #1abc9c; --dg-sw: 2; --dg-font: var(--f-flat); --dg-filter: none;
}
#screen[data-era="4"] .line { font-weight: 300; letter-spacing: -.01em; }
#screen[data-era="4"] .line em { font-weight: 600; }
#screen[data-era="4"] .eratitle b { font-weight: 300; }
