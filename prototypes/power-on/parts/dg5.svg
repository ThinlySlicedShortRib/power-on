<svg class="dg" viewBox="0 0 680 330" role="img" aria-label="Diagram: a world map with edge locations in many cities. A phone in Jakarta reaches a nearby Singapore edge function in about 10 milliseconds, which fetches data from a database in the US East region about 220 milliseconds away and streams HTML back. Below, a pipeline: git push, build, deploy everywhere, preview URL." data-dur="3000">
          <defs><marker id="d5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
          <rect class="zone" x="20" y="20" width="640" height="220" rx="12"/>
          <path class="grid" d="M20 60 H660 M20 100 H660 M20 140 H660 M20 180 H660 M20 220 H660 M100 20 V240 M180 20 V240 M260 20 V240 M340 20 V240 M420 20 V240 M500 20 V240 M580 20 V240"/>
          <path class="route" d="M540 172 L525 145 Q370 -10 206 84"/>
          <!-- edge nodes (equirectangular-ish) -->
          <g class="ts">
            <circle cx="123" cy="83" r="4.5" class="solid"/><text x="123" y="72" text-anchor="middle">San Francisco</text>
            <circle cx="258" cy="187" r="4.5" class="solid"/><text x="258" y="206" text-anchor="middle">São Paulo</text>
            <circle cx="340" cy="60" r="4.5" class="solid"/><text x="340" y="50" text-anchor="middle">London</text>
            <circle cx="346" cy="136" r="4.5" class="solid"/><text x="346" y="125" text-anchor="middle">Lagos</text>
            <circle cx="373" cy="204" r="4.5" class="solid"/><text x="373" y="223" text-anchor="middle">Cape Town</text>
            <circle cx="470" cy="115" r="4.5" class="solid"/><text x="470" y="104" text-anchor="middle">Mumbai</text>
            <circle cx="588" cy="86" r="4.5" class="solid"/><text x="588" y="75" text-anchor="middle">Tokyo</text>
            <circle cx="609" cy="204" r="4.5" class="solid"/><text x="609" y="223" text-anchor="middle">Sydney</text>
          </g>
          <!-- Singapore edge (active) -->
          <circle cx="525" cy="145" r="10" fill="none" class="acc"/>
          <circle cx="525" cy="145" r="4.5" class="accfill"/>
          <text class="t" x="510" y="149" text-anchor="end">edge function</text>
          <text class="ts" x="510" y="164" text-anchor="end">Singapore</text>
          <text class="tl" x="548" y="148">~10 ms</text>
          <!-- user phone -->
          <rect class="bx" x="534" y="170" width="14" height="24" rx="3"/>
          <text class="ts" x="556" y="186">you, Jakarta</text>
          <!-- database -->
          <path class="bx" d="M194 76 v14 a12 3 0 0 0 24 0 v-14"/>
          <ellipse class="bx" cx="206" cy="76" rx="12" ry="3"/>
          <text class="t" x="206" y="112" text-anchor="middle">database</text>
          <text class="ts" x="206" y="126" text-anchor="middle">us-east</text>
          <text class="tl" x="370" y="44" text-anchor="middle">~220 ms round trip to the data</text>
          <!-- pipeline -->
          <rect class="bx" x="30" y="266" width="120" height="36" rx="6"/><text class="t" x="90" y="289" text-anchor="middle">git push</text>
          <path class="ln" d="M150 284 H196" marker-end="url(#d5a)"/>
          <rect class="bx" x="200" y="266" width="120" height="36" rx="6"/><text class="t" x="260" y="289" text-anchor="middle">build</text>
          <path class="ln" d="M320 284 H366" marker-end="url(#d5a)"/>
          <text class="tl" x="343" y="318" text-anchor="middle">~1 min</text>
          <rect class="bx" x="370" y="266" width="160" height="36" rx="6"/><text class="t" x="450" y="289" text-anchor="middle">deploy everywhere</text>
          <path class="ln" d="M530 284 H556" marker-end="url(#d5a)"/>
          <rect class="bx" x="560" y="266" width="100" height="36" rx="6"/><text class="t" x="610" y="289" text-anchor="middle">preview URL</text>
          <circle class="packet" r="6" cx="540" cy="172"/>
        </svg>